url: https://www.just-eat.co.uk
scenarios:
- name: Baseline urban add to basket
  description: Add one vegan meal to the basket from an urban postcode.
  priority: critical
  feature_category: ecommerce
  target_feature: Restaurant discovery and basket
  test_persona: routine_rapid_doer
  steps_description: |
    Stay on just-eat.co.uk.
    Enter postcode EC1A 1BB.
    Find a restaurant with a clearly labeled vegan meal.
    Add one vegan meal to the basket.
    Verify that the basket shows the same item.
    Stop before checkout or payment.
  success_criteria: The basket shows one clearly labeled vegan item.

- name: Peanut allergy information before basket
  description: Determine whether a cautious customer can make an informed peanut-allergy choice.
  priority: critical
  feature_category: ecommerce
  target_feature: Allergy information and basket
  test_persona: cautious_comparator
  steps_description: |
    Stay on just-eat.co.uk.
    Enter postcode EC1A 1BB.
    Find a meal and inspect its allergy information before adding it.
    Look for explicit information about peanuts and cross-contamination.
    Add the meal only if the visible information supports an informed choice.
    If the information is insufficient, stop and record the blocker.
    Stop before checkout or payment.
  success_criteria: The customer can find clear peanut information before adding an item, or receives clear safety guidance.

- name: Vegan filter to basket
  description: Use dietary controls to add a clearly labeled vegan item.
  priority: critical
  feature_category: filtering_sorting
  target_feature: Dietary filters and basket
  test_persona: decisive_dietary_regular
  steps_description: |
    Stay on just-eat.co.uk.
    Enter postcode EC1A 1BB.
    Use the available dietary filter or search control for vegan food.
    Do not inspect restaurants that lack a visible vegan signal.
    Add one clearly labeled vegan item to the basket.
    Verify that the basket shows the same item.
    Stop before checkout or payment.
  success_criteria: The filter leads to a clearly labeled vegan item, and the basket shows that item.

- name: No local restaurant recovery
  description: Evaluate the recovery path when a postcode has no delivery supply.
  priority: critical
  feature_category: search
  target_feature: Empty results and recovery
  test_persona: impatient_single_tasker
  steps_description: |
    Stay on just-eat.co.uk.
    Enter postcode HS9 5XD.
    Attempt to find and add one meal to the basket.
    If no restaurants deliver, inspect the guidance and available recovery actions.
    Try one relevant recovery action, such as collection or location change.
    Stop before checkout or payment.
  success_criteria: The site explains the empty result and provides a useful recovery action.
